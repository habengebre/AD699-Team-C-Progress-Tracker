
name: AD699 Team C Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: team-c-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build isolated notebook environment
        run: |
          docker build \
            -f Dockerfile.notebook-test \
            -t team-c-notebook-test:latest \
            .

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ad699-team-c-validator
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Download latest Colab notebook
        env:
          NOTEBOOK_ID: ${{ vars.COLAB_NOTEBOOK_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import google.auth
          from google.auth.transport.requests import AuthorizedSession

          credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          session = AuthorizedSession(credentials)

          file_id = os.environ["NOTEBOOK_ID"]
          response = session.get(
              f"https://www.googleapis.com/drive/v3/files/{file_id}",
              params={"alt": "media"},
              timeout=60
          )
          response.raise_for_status()

          notebook = response.json()
          if not isinstance(notebook.get("cells"), list):
              raise ValueError("Invalid notebook format")

          with open("AD699_Team_C_Semester_Project.ipynb", "w") as f:
              json.dump(notebook, f)

          print("Notebook downloaded successfully")
          print("Cells:", len(notebook["cells"]))
          PY

      - name: Execute notebook in restricted Docker
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p notebook_test/input notebook_test/output

          cp AD699_Team_C_Semester_Project.ipynb \
            notebook_test/input/notebook.ipynb

          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777 \
            --env HOME=/tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 2g \
            --cpus 2 \
            --pids-limit 128 \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$PWD/notebook_test/input",target=/workspace/input,readonly \
            --mount type=bind,source="$PWD/notebook_test/output",target=/workspace/output \
            --mount type=bind,source="$PWD/notebook_test/run_notebook.py",target=/workspace/run_notebook.py,readonly \
            team-c-notebook-test:latest \
            python /workspace/run_notebook.py

          echo "Notebook execution report:"
          cat notebook_test/output/execution_report.json

      - name: Clear execution results for scheduled checks
        if: github.event_name == 'schedule'
        run: |
          rm -f notebook_test/output/execution_report.json
          echo "Scheduled update: notebook execution not tested."

      - name: Generate progress dashboard
        run: |
          python validator.py \
            --notebook AD699_Team_C_Semester_Project.ipynb

      - name: Publish dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Team_C_Progress_Dashboard.html Team_C_Progress_Report.json

          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "Update Team C progress dashboard [skip ci]"
            git push
          fi
