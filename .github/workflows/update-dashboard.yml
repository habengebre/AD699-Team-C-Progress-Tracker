
name: AD699 Team C Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-google-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ad699-team-c-validator
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Test notebook access
        env:
          NOTEBOOK_ID: ${{ vars.COLAB_NOTEBOOK_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import google.auth
          from google.auth.transport.requests import AuthorizedSession

          credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          session = AuthorizedSession(credentials)

          file_id = os.environ["NOTEBOOK_ID"]
          url = f"https://www.googleapis.com/drive/v3/files/{file_id}"

          response = session.get(
              url,
              params={"alt": "media"},
              timeout=60
          )
          response.raise_for_status()

          notebook = response.json()

          if not isinstance(notebook.get("cells"), list):
              raise ValueError("File is not a valid Jupyter notebook")

          print("SUCCESS: Google Drive notebook accessed")
          print("Notebook format:", notebook.get("nbformat"))
          print("Number of cells:", len(notebook["cells"]))
          print("Team C connection is working!")
          PY
